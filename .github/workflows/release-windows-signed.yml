name: Signed Windows artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-release
          cache-on-failure: true
      - name: Restore native runtime cache
        uses: actions/cache@v4
        with:
          path: src-tauri/.cache/native-runtime
          key: watchdog-native-runtime-${{ runner.os }}-${{ hashFiles('scripts/install-onnxruntime.ps1') }}
          restore-keys: |
            watchdog-native-runtime-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      - name: Install updater signature verifier
        shell: powershell
        run: choco install minisign --yes --no-progress
      - name: Validate release tag and configuration
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            node scripts/verify-release-config.mjs --tag $env:GITHUB_REF_NAME
          } else {
            node scripts/verify-release-config.mjs
          }
      - name: Build and verify signed artifacts
        shell: powershell
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run package:windows:signed
      - name: Prepare updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = "src-tauri/target/release/bundle/nsis/watch-dog_$($package.version)_x64-setup.exe"
          node scripts/prepare-github-release.mjs --tag $env:GITHUB_REF_NAME --installer $installer --signature "$installer.sig" --output artifacts/latest.json
      - name: Upload manual release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: watch-dog-signed-windows
          if-no-files-found: error
          path: |
            artifacts/watch-dog-*-windows-x64.zip
            artifacts/watch-dog-*-windows-x64.zip.sha256
            src-tauri/target/release/bundle/nsis/watch-dog_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/watch-dog_*_x64-setup.exe.sig
            artifacts/latest.json
            artifacts/release-notes.md
            artifacts/checksums.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = "src-tauri/target/release/bundle/nsis/watch-dog_$($package.version)_x64-setup.exe"
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "WatchDog $($package.version)" --notes-file artifacts/release-notes.md $installer "$installer.sig" artifacts/latest.json "artifacts/watch-dog-$($package.version)-windows-x64.zip" "artifacts/watch-dog-$($package.version)-windows-x64.zip.sha256" artifacts/checksums.sha256
